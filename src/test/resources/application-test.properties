spring.application.name=SkillSync-Test

server.port=0
server.forward-headers-strategy=framework
spring.config.import=

spring.data.mongodb.uri=mongodb://localhost:27017/skillsync_test

jwt.secret=ThisIsATestJwtSecretKeyForSkillSyncOnlyDoNotUseInProduction123456
jwt.expiration-ms=86400000
app.auth.cookie.secure=false
app.auth.cookie.same-site=Lax

code.execution.enabled=false
code.execution.timeout-seconds=3
code.execution.max-source-size-chars=20000
code.execution.max-output-size-chars=5000

app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000

spring.security.oauth2.client.registration.google.client-id=test-google-client-id
spring.security.oauth2.client.registration.google.client-secret=test-google-client-secret
spring.security.oauth2.client.registration.google.scope=openid,email,profile

app.oauth.frontend-success-url=http://localhost:3000/oauth-success
app.oauth.frontend-failure-url=http://localhost:3000/login?oauthError=true

spring.mail.host=
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.email.from=no-reply@skillsync.local
app.frontend.base-url=http://localhost:3000

app.auth.email-verification-expiration-minutes=1440
app.auth.password-reset-expiration-minutes=30
app.auth.candidate-invite-expiration-minutes=10080
app.auth.team-member-invite-expiration-minutes=10080
app.auth.oauth-exchange-expiration-minutes=5
app.auth.resend-verification-cooldown-seconds=60

billing.enabled=false
stripe.secret-key=
stripe.webhook-secret=

ai.features.enabled=false
gemini.api.key=
gemini.model=gemini-2.5-flash
gemini.timeout-seconds=30
