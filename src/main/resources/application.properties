spring.application.name=SkillSync

server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.config.import=optional:file:.env[.properties]

spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGODB_URI}}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

code.execution.enabled=${CODE_EXECUTION_ENABLED:true}
code.execution.timeout-seconds=${CODE_EXECUTION_TIMEOUT_SECONDS:8}
code.execution.max-source-size-chars=${CODE_EXECUTION_MAX_SOURCE_SIZE_CHARS:20000}
code.execution.max-output-size-chars=${CODE_EXECUTION_MAX_OUTPUT_SIZE_CHARS:5000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

app.oauth.frontend-success-url=${OAUTH_FRONTEND_SUCCESS_URL:http://localhost:3000/oauth-success}
app.oauth.frontend-failure-url=${OAUTH_FRONTEND_FAILURE_URL:http://localhost:3000/login?oauthError=true}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

app.email.from=${APP_EMAIL_FROM:no-reply@skillsync.local}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}

app.auth.email-verification-expiration-minutes=${EMAIL_VERIFICATION_EXPIRATION_MINUTES:1440}
app.auth.password-reset-expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:30}
app.auth.resend-verification-cooldown-seconds=${RESEND_VERIFICATION_COOLDOWN_SECONDS:60}


ai.features.enabled=${AI_FEATURES_ENABLED:false}
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:30}