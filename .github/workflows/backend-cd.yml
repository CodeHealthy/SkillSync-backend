name: Backend CD

on:
  push:
    branches:
      - uat
  workflow_dispatch:

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Run tests
        run: mvn test

      - name: Build package
        run: mvn clean package -DskipTests

      - name: Deploy to EC2 UAT
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd /home/ubuntu/apps/SkillSync-backend

            git fetch origin
            git checkout uat
            git pull origin uat
            cat > .env <<'EOF'
            MONGODB_URI=${{ secrets.MONGODB_URI }}
            SPRING_DATA_MONGODB_URI=${{ secrets.MONGODB_URI }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRATION_MS=${{ secrets.JWT_EXPIRATION_MS }}
            CODE_EXECUTION_ENABLED=true
            CODE_EXECUTION_TIMEOUT_SECONDS=8
            CODE_EXECUTION_MAX_SOURCE_SIZE_CHARS=20000
            CODE_EXECUTION_MAX_OUTPUT_SIZE_CHARS=5000
            CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
            PORT=8080
            EOF
  
            mvn clean package -DskipTests
  
            sudo systemctl restart skillsync-backend
            sleep 8
            sudo systemctl status skillsync-backend --no-pager