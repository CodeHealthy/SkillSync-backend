name: Backend CD

on:
  push:
    branches:
      - uat
  workflow_dispatch:

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Run tests
        run: mvn test

      - name: Build package
        run: mvn clean package -DskipTests

      - name: Deploy to EC2 UAT
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd /home/ubuntu/apps/SkillSync-backend

            git fetch origin
            git checkout uat
            git pull origin uat
            
            cat > .env <<'EOF'
            MONGODB_URI=${{ secrets.MONGODB_URI }}
            SPRING_DATA_MONGODB_URI=${{ secrets.MONGODB_URI }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRATION_MS=${{ secrets.JWT_EXPIRATION_MS }}
  
            CODE_EXECUTION_ENABLED=true
            CODE_EXECUTION_TIMEOUT_SECONDS=8
            CODE_EXECUTION_MAX_SOURCE_SIZE_CHARS=20000
            CODE_EXECUTION_MAX_OUTPUT_SIZE_CHARS=5000
  
            CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
  
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            OAUTH_FRONTEND_SUCCESS_URL=${{ secrets.OAUTH_FRONTEND_SUCCESS_URL }}
            OAUTH_FRONTEND_FAILURE_URL=${{ secrets.OAUTH_FRONTEND_FAILURE_URL }}
  
            MAIL_HOST=${{ secrets.MAIL_HOST }}
            MAIL_PORT=${{ secrets.MAIL_PORT }}
            MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
            APP_EMAIL_FROM=${{ secrets.APP_EMAIL_FROM }}
            FRONTEND_BASE_URL=${{ secrets.FRONTEND_BASE_URL }}
            EMAIL_VERIFICATION_EXPIRATION_MINUTES=1440
            APP_EMAIL_PROVIDER=${{ secrets.APP_EMAIL_PROVIDER }}
            PASSWORD_RESET_EXPIRATION_MINUTES=30
            RESEND_VERIFICATION_COOLDOWN_SECONDS=60
            AI_FEATURES_ENABLED=${{ secrets.AI_FEATURES_ENABLED}}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY}}
            GEMINI_MODEL=${{ secrets.GEMINI_MODEL}}
            GEMINI_TIMEOUT_SECONDS=${{ secrets.GEMINI_TIMEOUT_SECONDS}}
            BILLING_ENABLED=${{ secrets.BILLING_ENABLED}}
            STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY}}
            STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET}}
            STRIPE_STARTER_PRICE_ID=${{ secrets.STRIPE_STARTER_PRICE_ID }}
            STRIPE_GROWTH_PRICE_ID=${{ secrets.STRIPE_GROWTH_PRICE_ID }}
            STRIPE_BUSINESS_PRICE_ID=${{ secrets.STRIPE_BUSINESS_PRICE_ID }}
            CANDIDATE_INVITE_EXPIRATION_MINUTES=${{ secrets.CANDIDATE_INVITE_EXPIRATION_MINUTES }}
            TEAM_MEMBER_INVITE_EXPIRATION_MINUTES=${{ secrets.TEAM_MEMBER_INVITE_EXPIRATION_MINUTES }}
            AUTH_COOKIE_SECURE=${{ secrets.AUTH_COOKIE_SECURE }}
            AUTH_COOKIE_SAME_SITE=${{ secrets.AUTH_COOKIE_SAME_SITE }}
  
            PORT=8080
            EOF
  
            mvn clean package -DskipTests
  
            sudo systemctl restart skillsync-backend
            sleep 8
            sudo systemctl status skillsync-backend --no-pager
